<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<link rel="icon" href="https://fav.farm/🌐">
<title>HP SRC LEAKER</title>
<style>
:root{--bg:#080b14;--card:#101728;--line:#263550;--text:#f1f6ff;--muted:#9aa9c3;--cyan:#20e8ff;--purple:#9d5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1000px,92%);margin:auto}
header{padding:18px 0;border-bottom:1px solid var(--line);background:#080b14}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}
.hero{text-align:center;padding:55px 0 35px}.hero h1{font-size:clamp(34px,7vw,60px);margin:10px 0}.hero h1 span{color:var(--cyan)}.hero p{color:var(--muted)}.btn{display:inline-block;padding:10px 15px;border-radius:10px;background:var(--cyan);color:#07101b;font-weight:bold}
section{padding:25px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h2{margin:0}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);margin:15px 0}.filters{display:flex;gap:8px;margin-bottom:16px}.filter{padding:9px 13px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text)}.filter.active{border-color:var(--cyan);color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.app{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.app h3{margin:8px 0 14px;font-size:17px}.icon{font-size:28px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.version{font-size:12px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:25px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}footer{margin-top:35px;padding:22px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style>
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<header>
  <div class="wrap brand">
    <img src="logo.png" alt="HP Logo" width="45" height="45">
    <span>SRC LEAKER</span>
  </div>
</header>
<main>
<section class="hero wrap"><h1>HP SRC <span>LEAKER</span></h1><p>Apps and source-code releases.</p><a class="btn" href="#apps">View Releases</a></section>
<section class="wrap" id="apps">
  <div class="head"><h2>Latest Releases</h2><span id="count">0 Releases</span></div>
  <input class="search" id="search" type="search" placeholder="Search apps or source code..." aria-label="Search releases">
  <div class="filters" id="filters">
  <button class="filter active" data-cat="All Categories">All Categories</button>
  <button class="filter" data-cat="Apps">Apps</button>
  <button class="filter" data-cat="Source">Source</button>
</div>
  <div class="grid" id="appGrid"></div>
</section>
</main>
<footer><div class="wrap">© <span id="year"></span> HP SRC LEAKER</div></footer>
<script>
// ADD YOUR RELEASES HERE. No example apps or links are pre-added.
const resources = [
//  {
//  name: "MT MANAGER PRO",
//  category: "Apps",
//  icon: "MT",
//  version: "all versions",
//  url: "YO "
//},
   {
  name: "NDK",
  category: "Source",
  icon: "ndk.png",
  version: "all versions",
  url: "YO "
},
];

let activeCategory = "All Categories";
const grid = document.getElementById("appGrid");
const search = document.getElementById("search");

function renderApps() {
  const word = search.value.trim().toLowerCase();
  const list = resources.filter(app => {
    const categoryMatch = activeCategory === "All Categories" || app.category === activeCategory;
    const searchMatch = app.name.toLowerCase().includes(word);
    return categoryMatch && searchMatch;
  });

  document.getElementById("count").textContent = resources.length + " Releases";
  grid.innerHTML = "";

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">No releases added yet.</div>';
    return;
  }

  list.forEach(app => {
    const card = document.createElement("article");
    card.className = "app";
    card.innerHTML = `<div class="icon">${app.icon && app.icon.toLowerCase().endsWith(".png") ? `<img src="./${app.icon}" alt="${app.name}" style="width:48px;height:48px;object-fit:contain;">` : (app.icon || "📦")}</div><h3></h3><div class="row"><span class="version"></span><a class="btn" target="_blank" rel="noopener">Open</a></div>`;
    card.querySelector("h3").textContent = app.name;
    card.querySelector(".version").textContent = app.version || "";
    card.querySelector("a").href = app.url;
    grid.appendChild(card);
  });
}

document.getElementById("filters").addEventListener("click", event => {
  const button = event.target.closest("button[data-cat]");
  if (!button) return;
  activeCategory = button.dataset.cat;
  document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
  renderApps();
});
search.addEventListener("input", renderApps);
document.getElementById("year").textContent = new Date().getFullYear();
renderApps();
</script>
</body>
</html>
